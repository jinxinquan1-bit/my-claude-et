<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>学迹 · 统计</title>
<link href="assets/css/fonts.css" rel="stylesheet"/>
<link href="assets/css/common.css" rel="stylesheet"/>
<script src="assets/vendor/tailwind.js"></script>
<script src="assets/js/theme.js"></script>
</head>
<body class="bg-app-bg min-h-screen text-on-surface">
<div data-shell="app" data-active="stats"></div>

<main class="md:ml-[260px] md:pt-16 pt-14 pb-24 md:pb-8 px-margin-mobile md:px-margin-desktop max-w-max-content-width mx-auto">
  <h1 class="text-headline-xl font-bold text-text-heading py-6 md:py-8">统计</h1>

  <!-- 全局概览 -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-5">
      <div class="text-label-md text-text-muted">在读学生</div>
      <div class="text-headline-md font-bold text-primary mt-1.5" id="ov-active">—</div>
    </div>
    <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-5">
      <div class="text-label-md text-text-muted">今日已记录</div>
      <div class="text-headline-md font-bold text-text-main mt-1.5" id="ov-today">—</div>
    </div>
    <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-5">
      <div class="text-label-md text-text-muted">今日待记录</div>
      <div class="text-headline-md font-bold text-success-deep mt-1.5" id="ov-pending">—</div>
    </div>
    <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-5">
      <div class="text-label-md text-text-muted">近 7 天记录</div>
      <div class="text-headline-md font-bold text-text-main mt-1.5" id="ov-week">—</div>
    </div>
  </div>

  <!-- 学生维度筛选 -->
  <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-5 mb-6">
    <div class="flex flex-col md:flex-row md:items-center gap-4">
      <div class="flex-1 max-w-xs">
        <label class="block text-label-md text-text-muted mb-1.5" for="sel-student">选择学生</label>
        <select id="sel-student" class="w-full px-3.5 py-2.5 rounded-xl border border-border-light text-input-text focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-shadow"></select>
      </div>
      <div>
        <label class="block text-label-md text-text-muted mb-1.5">时间范围</label>
        <div class="inline-flex gap-2 rounded-xl border border-border-light bg-app-bg p-1" id="period-seg">
          <button type="button" data-v="week" class="seg-btn on px-4 py-1.5 rounded-lg text-body-sm transition-colors">本周</button>
          <button type="button" data-v="month" class="seg-btn px-4 py-1.5 rounded-lg text-body-sm transition-colors">本月</button>
          <button type="button" data-v="custom" class="seg-btn px-4 py-1.5 rounded-lg text-body-sm transition-colors">自定义</button>
        </div>
      </div>
      <div id="custom-range" class="hidden md:flex items-center gap-2 flex-1">
        <input type="date" value="2026-08-29" class="px-3 py-2 rounded-xl border border-border-light text-input-text focus:border-primary outline-none"/>
        <span class="text-text-muted">至</span>
        <input type="date" value="2026-09-04" class="px-3 py-2 rounded-xl border border-border-light text-input-text focus:border-primary outline-none"/>
      </div>
    </div>
  </div>

  <!-- 学生统计卡 -->
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-5">
      <div class="text-label-md text-text-muted">记录次数</div>
      <div class="text-headline-md font-bold text-primary mt-1.5" id="st-count">—</div>
    </div>
    <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-5">
      <div class="text-label-md text-text-muted">作业完成率</div>
      <div class="text-headline-md font-bold text-success-deep mt-1.5" id="st-rate">—</div>
    </div>
    <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-5">
      <div class="text-label-md text-text-muted">平均专注度</div>
      <div class="text-headline-md font-bold text-text-main mt-1.5" id="st-focus">—</div>
    </div>
  </div>

  <!-- 图表区 -->
  <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 md:gap-6">
    <div class="chart-wrap">
      <div class="chart-title">专注度趋势</div>
      <div id="c-line"></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">作业完成分布</div>
      <div id="c-donut"></div>
    </div>
  </div>
  <div class="chart-wrap">
    <div class="chart-title">知识点掌握分布</div>
    <div id="c-mastery"></div>
  </div>
</main>

<script src="assets/js/mock-data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/page-stats.js"></script>
</body>
</html>
