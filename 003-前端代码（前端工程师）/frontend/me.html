<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>学迹 · 我的</title>
<link href="assets/css/fonts.css" rel="stylesheet"/>
<link href="assets/css/common.css" rel="stylesheet"/>
<script src="assets/vendor/tailwind.js"></script>
<script src="assets/js/theme.js"></script>
</head>
<body class="bg-app-bg min-h-screen text-on-surface">
<div data-shell="app" data-active="me"></div>

<main class="md:ml-[260px] md:pt-16 pt-14 pb-24 md:pb-8 px-margin-mobile md:px-margin-desktop max-w-max-content-width mx-auto">
  <h1 class="text-headline-xl font-bold text-text-heading py-6 md:py-8">我的</h1>

  <div class="max-w-2xl space-y-4">
    <!-- 账号卡 -->
    <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-6 flex items-center gap-4">
      <span class="avatar-initial w-14 h-14 rounded-full text-headline-md" data-initial="王老师"></span>
      <div class="flex-1">
        <div class="text-title-lg font-semibold text-text-main" id="user-name">王老师</div>
        <div class="text-label-md text-text-muted mt-0.5">家教老师 · 管理 14 名学生</div>
      </div>
    </div>

    <!-- 菜单 -->
    <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light overflow-hidden">
      <a href="reports.html" class="flex items-center gap-3 px-5 py-4 hover:bg-app-bg transition-colors border-b border-border-light">
        <span class="material-symbols-outlined text-primary">description</span>
        <span class="flex-1 text-body-md text-text-body">报告管理</span>
        <span class="material-symbols-outlined text-text-placeholder text-[20px]">chevron_right</span>
      </a>
      <a href="stats.html" class="flex items-center gap-3 px-5 py-4 hover:bg-app-bg transition-colors border-b border-border-light">
        <span class="material-symbols-outlined text-primary">monitoring</span>
        <span class="flex-1 text-body-md text-text-body">数据统计</span>
        <span class="material-symbols-outlined text-text-placeholder text-[20px]">chevron_right</span>
      </a>
      <button class="w-full flex items-center gap-3 px-5 py-4 hover:bg-app-bg transition-colors border-b border-border-light tap-highlight" id="about">
        <span class="material-symbols-outlined text-primary">info</span>
        <span class="flex-1 text-body-md text-text-body text-left">关于学迹</span>
        <span class="text-label-md text-text-muted">v1.0.1 ›</span>
      </button>
      <button class="w-full flex items-center gap-3 px-5 py-4 hover:bg-danger-light transition-colors tap-highlight" id="logout">
        <span class="material-symbols-outlined text-danger">logout</span>
        <span class="flex-1 text-body-md text-danger text-left">退出登录</span>
      </button>
    </div>
  </div>
</main>

<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/page-me.js"></script>
</body>
</html>
