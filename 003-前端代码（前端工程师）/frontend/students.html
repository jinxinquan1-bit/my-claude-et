<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>学迹 · 学生列表</title>
<link href="assets/css/fonts.css" rel="stylesheet"/>
<link href="assets/css/common.css" rel="stylesheet"/>
<script src="assets/vendor/tailwind.js"></script>
<script src="assets/js/theme.js"></script>
</head>
<body class="bg-surface-bg min-h-screen text-text-body">
<div data-shell="app" data-active="students"></div>

<main class="md:ml-[260px] md:pt-16 pt-14 pb-24 md:pb-8 px-margin-mobile md:px-margin-desktop max-w-max-content-width mx-auto">
  <div class="flex items-center justify-between py-6 md:py-8">
    <h1 class="text-headline-xl font-bold text-text-heading">学生</h1>
    <a href="record.html" class="md:hidden flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-primary text-white text-label-md font-medium tap-highlight">
      <span class="material-symbols-outlined text-[18px]">edit_note</span>记一笔
    </a>
  </div>

  <!-- 搜索与筛选 -->
  <div class="flex gap-3 mb-5">
    <div class="relative flex-1 max-w-md">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[20px] text-text-placeholder">search</span>
      <input id="search" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-surface-card border border-border-standard text-input-text placeholder:text-text-placeholder focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-shadow"
             placeholder="搜索学生姓名"/>
    </div>
    <button class="px-4 rounded-xl bg-surface-card border border-border-standard text-text-body hover:bg-app-bg flex items-center gap-1.5 tap-highlight" data-demo="筛选">
      <span class="material-symbols-outlined text-[20px]">tune</span><span class="hidden sm:inline text-body-sm">筛选</span>
    </button>
  </div>

  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2">
      <span class="text-title-md font-semibold text-text-heading">全部学生</span>
      <span class="text-label-sm text-text-muted" id="count"></span>
    </div>
    <div class="hidden md:flex gap-2">
      <a href="record.html" class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-primary hover:bg-primary-hover text-white text-body-sm font-medium transition-colors">
        <span class="material-symbols-outlined text-[18px]">edit_note</span>记一笔
      </a>
    </div>
  </div>

  <!-- 学生卡片网格 -->
  <div id="student-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</main>

<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/page-students.js"></script>
</body>
</html>
