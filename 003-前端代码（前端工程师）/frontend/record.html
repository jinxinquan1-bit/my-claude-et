<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>学迹 · 记一笔</title>
<link href="assets/css/fonts.css" rel="stylesheet"/>
<link href="assets/css/common.css" rel="stylesheet"/>
<script src="assets/vendor/tailwind.js"></script>
<script src="assets/js/theme.js"></script>
</head>
<body class="bg-app-bg min-h-screen text-on-surface">
<div data-shell="app" data-active="students"></div>

<main class="md:ml-[260px] md:pt-16 pt-14 pb-32 md:pb-28 px-margin-mobile md:px-margin-desktop max-w-max-content-width mx-auto">
  <!-- 面包屑 -->
  <div class="flex items-center gap-1.5 py-4 text-label-md text-text-muted">
    <a href="students.html" class="hover:text-primary transition-colors">学生列表</a>
    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
    <a href="student-detail.html" class="hover:text-primary transition-colors">陈小明</a>
    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
    <span class="text-text-body">新记录</span>
  </div>

  <!-- 标题 -->
  <div class="flex flex-wrap items-center gap-3 py-2 mb-4">
    <h1 class="text-headline-xl font-bold text-text-main">学习记录录入</h1>
    <span id="draft-badge" class="hidden text-label-sm px-2.5 py-1 rounded-full bg-success-light text-success-deep">草稿已保存</span>
  </div>

  <!-- 错误横幅（演示态） -->
  <div id="error-banner" class="error-banner hidden">保存失败，请检查必填项</div>

  <div class="grid grid-cols-1 xl:grid-cols-12 gap-4 md:gap-6">
    <!-- 左列（8 列） -->
    <div class="xl:col-span-8 space-y-4 md:space-y-6">
      <!-- 课程详情卡 -->
      <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-6">
        <h2 class="text-title-md font-semibold text-text-main mb-4">课程详情</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-label-md text-text-muted mb-1.5" for="f-date">日期</label>
            <input id="f-date" type="date" value="2026-09-04"
                   class="w-full px-3.5 py-2.5 rounded-xl border border-border-light text-input-text text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-shadow"/>
          </div>
          <div>
            <label class="block text-label-md text-text-muted mb-1.5" for="f-subject">科目</label>
            <select id="f-subject" class="w-full px-3.5 py-2.5 rounded-xl border border-border-light text-input-text text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-shadow">
              <option selected>数学</option><option>英语</option><option>物理</option><option>语文</option><option>化学</option>
            </select>
          </div>
        </div>
        <div class="mt-4">
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-label-md text-text-muted" for="f-content">学习内容</label>
            <span class="text-label-sm text-text-placeholder">选填</span>
          </div>
          <div class="border border-border-light rounded-xl overflow-hidden">
            <div class="flex items-center gap-1 px-2 py-1.5 border-b border-border-light bg-app-bg">
              <button type="button" class="w-8 h-8 rounded-lg hover:bg-card-white flex items-center justify-center tap-highlight" data-demo="加粗"><span class="material-symbols-outlined text-[18px]">format_bold</span></button>
              <button type="button" class="w-8 h-8 rounded-lg hover:bg-card-white flex items-center justify-center tap-highlight" data-demo="列表"><span class="material-symbols-outlined text-[18px]">format_list_bulleted</span></button>
              <button type="button" class="w-8 h-8 rounded-lg hover:bg-card-white flex items-center justify-center tap-highlight" data-demo="待办"><span class="material-symbols-outlined text-[18px]">checklist</span></button>
            </div>
            <textarea id="f-content" rows="5" placeholder="这节课学了什么？如：一元二次方程：配方法与公式法"
                      class="w-full px-3.5 py-3 text-input-text text-on-surface placeholder:text-text-placeholder outline-none resize-y"></textarea>
          </div>
        </div>
      </div>

      <!-- 知识点掌握卡 -->
      <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-6">
        <h2 class="text-title-md font-semibold text-text-main mb-4">知识点掌握情况</h2>
        <div class="space-y-5">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-body-sm text-text-body">一元二次方程</span>
              <span class="text-label-sm px-2 py-0.5 rounded-full bg-mastery-3-container text-primary-deep">基本掌握</span>
            </div>
            <div class="h-2 bg-border-light rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-mastery-3" style="width:80%"></div>
            </div>
          </div>
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-body-sm text-text-body">应用题建模</span>
              <span class="text-label-sm px-2 py-0.5 rounded-full bg-mastery-1-container text-primary-deep">初步掌握</span>
            </div>
            <div class="h-2 bg-border-light rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-mastery-1" style="width:45%"></div>
            </div>
          </div>
        </div>
        <div class="mt-5 pt-4 border-t border-border-light">
          <button type="button" class="flex items-center gap-1.5 text-body-sm text-primary hover:text-primary-hover transition-colors tap-highlight" data-demo="添加知识点">
            <span class="material-symbols-outlined text-[18px]">add_circle</span>添加知识点
          </button>
        </div>
      </div>
    </div>

    <!-- 右列（4 列） -->
    <div class="xl:col-span-4 space-y-4 md:space-y-6">
      <!-- 专注度 -->
      <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-6">
        <h2 class="text-title-md font-semibold text-text-main mb-4">课堂专注度</h2>
        <div id="focus-stars"></div>
      </div>

      <!-- 作业完成情况 -->
      <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-6">
        <h2 class="text-title-md font-semibold text-text-main mb-4">作业完成情况</h2>
        <div id="homework-seg" class="inline-flex flex-wrap gap-2 rounded-xl border border-border-light bg-app-bg p-1">
          <button type="button" data-v="done" class="seg-btn px-3.5 py-1.5 rounded-lg text-body-sm transition-colors">已完成</button>
          <button type="button" data-v="partial" class="seg-btn px-3.5 py-1.5 rounded-lg text-body-sm transition-colors">部分完成</button>
          <button type="button" data-v="undone" class="seg-btn px-3.5 py-1.5 rounded-lg text-body-sm transition-colors">未完成</button>
          <button type="button" data-v="none" class="seg-btn px-3.5 py-1.5 rounded-lg text-body-sm transition-colors">无作业</button>
        </div>
      </div>

      <!-- 课堂表现 -->
      <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-6">
        <h2 class="text-title-md font-semibold text-text-main mb-4">课堂表现</h2>
        <div id="tag-chips" class="flex flex-wrap gap-2">
          <button type="button" data-t="状态很好" class="chip-btn px-3.5 py-1.5 rounded-full border border-border-light text-body-sm transition-colors">状态很好</button>
          <button type="button" data-t="状态一般" class="chip-btn px-3.5 py-1.5 rounded-full border border-border-light text-body-sm transition-colors">状态一般</button>
          <button type="button" data-t="注意力不集中" class="chip-btn px-3.5 py-1.5 rounded-full border border-border-light text-body-sm transition-colors">注意力不集中</button>
          <button type="button" data-t="情绪低落" class="chip-btn px-3.5 py-1.5 rounded-full border border-border-light text-body-sm transition-colors">情绪低落</button>
          <button type="button" data-t="进步明显" class="chip-btn px-3.5 py-1.5 rounded-full border border-border-light text-body-sm transition-colors">进步明显</button>
          <button type="button" data-t="需要鼓励" class="chip-btn px-3.5 py-1.5 rounded-full border border-border-light text-body-sm transition-colors">需要鼓励</button>
        </div>
      </div>

      <!-- 内部评语 -->
      <div class="bg-card-white rounded-2xl shadow-level-1 border border-border-light p-6">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-title-md font-semibold text-text-main">给家长的话</h2>
          <span class="text-label-sm text-text-placeholder">会展示给家长</span>
        </div>
        <textarea id="f-comment" rows="3" placeholder="一句话点评，如：今天状态不错，应用题还需多练"
                  class="w-full px-3.5 py-3 rounded-xl border border-border-light text-input-text placeholder:text-text-placeholder focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none resize-y transition-shadow"></textarea>
      </div>
    </div>
  </div>
</main>

<!-- 底部固定操作栏 -->
<div class="fixed bottom-0 md:left-[260px] inset-x-0 z-30 bg-card-white/95 backdrop-blur border-t border-border-light pb-safe">
  <div class="max-w-max-content-width mx-auto flex gap-3 justify-end px-margin-mobile md:px-margin-desktop py-3">
    <button id="btn-draft" class="px-5 py-2.5 rounded-xl border border-border-light text-body-sm text-text-body hover:bg-app-bg transition-colors tap-highlight">存为草稿</button>
    <button id="btn-save" class="flex items-center gap-2 px-6 py-2.5 rounded-xl bg-primary hover:bg-primary-hover text-white text-body-sm font-medium shadow-fab transition-colors tap-highlight">
      <span class="material-symbols-outlined text-[18px]">save</span>保存记录
    </button>
  </div>
</div>

<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/page-record.js"></script>
</body>
</html>
